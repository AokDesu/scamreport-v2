name: Foundation acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Start local Supabase (no hosted credentials)
        run: supabase start --exclude studio,postgres-meta,realtime,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Database, API and web component tests; generate real report
        id: tests
        run: |
          rm -f docs/test-report.md
          bun run test
      - name: Upload test report even on failure
        if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: docs/test-report.md
      - run: bun run build
      - uses: docker/setup-buildx-action@v3
      - name: Image names
        id: image
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Authenticate GHCR on main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API; publish on main
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.prefix }}-api:latest
            ${{ steps.image.outputs.prefix }}-api:${{ github.sha }}
      - name: Build web; publish on main
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.prefix }}-web:latest
            ${{ steps.image.outputs.prefix }}-web:${{ github.sha }}
      - name: Stop this job's local stack
        if: always()
        run: supabase stop --no-backup
